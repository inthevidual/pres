<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Agenda 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Geist:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d12;--bg2:#121822;--fg:#f4f6f8;--muted:#9aa4b2;--line:rgba(255,255,255,.1);
  --un:#5b92e5;--red:#e5243b;--pen:#ff2f3f;
  --g1:#e5243b;--g2:#0a97d9;--g3:#56c02b;
  --sdg:linear-gradient(90deg,#E5243B,#DDA63A,#4C9F38,#C5192D,#FF3A21,#26BDE2,#FCC30B,#A21942,#FD6925,#DD1367,#FD9D24,#BF8B2E,#3F7E44,#0A97D9,#56C02B,#00689D,#19486A);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-weight:400;line-height:.95;letter-spacing:-.01em}
button,input{font:inherit}

/* ---------- app / stage ---------- */
#app{position:fixed;inset:0;transition:filter 1s cubic-bezier(.2,.7,.2,1)}
#app.locked{filter:blur(22px) brightness(.5) saturate(1.3)}
#app::before{content:"";position:absolute;inset:0;background:
  radial-gradient(1200px 700px at 8% 100%,rgba(91,146,229,.14),transparent 60%),
  radial-gradient(900px 600px at 100% 0%,rgba(229,36,59,.10),transparent 60%);pointer-events:none}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0}
.slide{position:absolute;inset:0;padding:96px 110px;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
.slide.is-active{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s}
.eyebrow{font-size:18px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--un)}
.eyebrow.c{color:var(--c)}
.frag{opacity:0;transform:translateY(16px);transition:opacity .45s ease,transform .45s ease}
.frag.on{opacity:1;transform:none}

#progress{position:fixed;left:0;top:0;height:6px;width:100%;background:var(--sdg);transform-origin:0 50%;transform:scaleX(0);transition:transform .4s ease;z-index:5}
#hud{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);z-index:5;pointer-events:none}
#hud b{color:var(--fg);font-weight:600}

/* ---------- wheel ---------- */
.wheel svg{width:100%;height:100%;display:block;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- title slide ---------- */
.slide-title{display:flex;align-items:center;gap:80px}
.slide-title .wheel{width:360px;height:360px;flex:none;filter:drop-shadow(0 20px 50px rgba(0,0,0,.5))}
.title-block{display:flex;flex-direction:column;gap:12px}
.agenda{font-size:172px;margin-top:6px}
.year-row{display:flex;align-items:flex-start;gap:28px;height:190px}
.year-old{position:relative;font-size:172px;font-family:"Archivo Black",Impact,sans-serif;line-height:.95;color:var(--fg);display:inline-block}
.strike{position:absolute;left:-4%;top:28%;width:108%;height:48%;overflow:visible;pointer-events:none}
.strike path{fill:none;stroke:var(--pen);stroke-width:7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;filter:drop-shadow(0 0 6px rgba(255,47,63,.35))}
.strike path:nth-child(2){stroke-width:5;opacity:.85}
.year-new{font-family:"Permanent Marker",cursive;font-size:150px;line-height:1;color:var(--pen);transform:rotate(-7deg) translateY(-30px);display:inline-block;text-shadow:0 0 18px rgba(255,47,63,.35)}
.unlocked .strike path{animation:draw .55s cubic-bezier(.4,0,.2,1) .35s both}
.unlocked .strike path:nth-child(2){animation-delay:.6s}
.unlocked .year-new{animation:pop .5s cubic-bezier(.2,1.4,.4,1) 1s both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:rotate(-16deg) translateY(-30px) scale(.6)}to{opacity:1;transform:rotate(-7deg) translateY(-30px) scale(1)}}
.meta{margin-top:26px;border-left:4px solid var(--un);padding-left:22px;display:flex;flex-direction:column;gap:4px}
.meta-event{font-size:30px;font-weight:600}
.meta-date{font-size:22px;color:var(--muted)}
.meta-name{font-size:22px;font-weight:600;margin-top:8px}

/* ---------- tiles (SDG-parodi) ---------- */
.tile{position:relative;width:400px;height:400px;background:var(--c,var(--un));color:#fff;padding:30px 30px 28px;display:flex;flex-direction:column;box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)}
.tile-head{display:flex;gap:18px;align-items:flex-start}
.tile-num{font-family:"Archivo Black",Impact,sans-serif;font-size:68px;line-height:.85}
.tile-title{font-family:"Archivo Black",Impact,sans-serif;font-size:27px;line-height:1.05;text-transform:uppercase;padding-top:7px;min-width:0;overflow-wrap:anywhere}
.tile-icon{margin:auto auto 0;width:170px;height:170px;stroke:#fff;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile-sm{width:300px;height:300px;padding:22px}
.tile-sm .tile-num{font-size:60px}
.tile-sm .tile-title{font-size:25px;padding-top:6px}
.tile-sm .tile-icon{width:120px;height:120px}

/* ---------- agenda slide ---------- */
.slide-agenda h2{font-size:96px;margin:14px 0 54px}
.tiles{display:flex;gap:40px}

/* ---------- goal slides ---------- */
.slide-goal{display:flex;gap:70px;align-items:flex-start}
.slide-goal .tile{flex:none}
.goal-body{flex:1;min-width:0;padding-top:6px}
.goal-body h2{font-size:56px;margin:12px 0 44px;text-transform:uppercase;letter-spacing:0}
.targets{list-style:none;display:flex;flex-direction:column;gap:30px}
.targets li{display:grid;grid-template-columns:96px 1fr;gap:22px;align-items:baseline}
.tnum{font-family:"Archivo Black",Impact,sans-serif;font-size:36px;color:var(--c);line-height:1}
.targets p{font-size:28px;line-height:1.35;font-weight:400}
.targets p b{font-weight:700}
.targets p em{font-style:italic;color:var(--muted)}
.targets p q{quotes:"”" "”"}
.targets .aside{display:block;font-size:20px;color:var(--muted);margin-top:8px;line-height:1.4}

/* ---------- summary ---------- */
.slide-summary{display:flex;flex-direction:column;justify-content:center;gap:34px}
.slide-summary h2{font-size:64px}
.summary-text{font-size:44px;line-height:1.3;font-weight:500;max-width:1320px}
.summary-text mark{background:none;color:var(--c);font-weight:700}
.summary-strip{display:flex;gap:16px;margin-top:10px}
.summary-strip span{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.summary-strip i{width:14px;height:14px;background:var(--c);display:inline-block}

/* ---------- end ---------- */
.slide-end{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:34px}
.slide-end .wheel{width:260px;height:260px}
.slide-end h2{font-size:140px}
.slide-end p{font-size:28px;color:var(--muted);max-width:900px;line-height:1.4}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;transition:opacity .5s ease,visibility 0s linear .5s;background:radial-gradient(800px 500px at 50% 40%,rgba(91,146,229,.10),transparent 70%)}
#gate.away{opacity:0;visibility:hidden}
.card{width:min(440px,100%);background:rgba(14,18,26,.86);border:1px solid var(--line);border-radius:22px;padding:34px 36px 30px;backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:0 40px 100px -20px rgba(0,0,0,.8),0 0 0 1px rgba(0,0,0,.4);position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .4s}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:6px;background:var(--sdg)}
#gate.away .card{transform:scale(1.06) translateY(-10px);opacity:0}
.card-head{display:flex;align-items:center;gap:18px;margin-bottom:22px}
.card-head .wheel{width:64px;height:64px;flex:none}
.card-head h2{font-size:30px;line-height:1}
.card-head h2 s{text-decoration:none;position:relative;color:rgba(244,246,248,.55)}
.card-head h2 s::after{content:"";position:absolute;left:-3%;right:-3%;top:48%;height:3px;background:var(--pen);transform:rotate(-6deg);border-radius:3px}
.card-head h2 .pen{font-family:"Permanent Marker",cursive;color:var(--pen);font-size:32px;display:inline-block;transform:rotate(-5deg)}
.card-head p{font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.card label{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.card input{width:100%;background:#0a0d12;border:1px solid var(--line);border-radius:12px;color:var(--fg);padding:14px 16px;font-size:18px;outline:none;transition:border-color .2s,box-shadow .2s;letter-spacing:.08em}
.card input:focus{border-color:var(--un);box-shadow:0 0 0 4px rgba(91,146,229,.2)}
.card button{width:100%;margin-top:14px;background:var(--un);color:#fff;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;cursor:pointer;transition:transform .15s,filter .15s}
.card button:hover{filter:brightness(1.1)}
.card button:active{transform:scale(.98)}
.card button[disabled]{opacity:.6;cursor:progress}
.err{min-height:20px;margin-top:12px;font-size:14px;color:var(--pen);font-weight:500;text-align:center}
.card.shake{animation:shake .45s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.card-foot{margin-top:18px;font-size:11px;color:rgba(154,164,178,.6);text-align:center;letter-spacing:.06em}

@media (max-width:700px){#hud{font-size:9px;padding:10px 12px;gap:12px}}
@media (prefers-reduced-motion:reduce){.wheel svg{animation:none}.frag{transition:none}}
</style>
</head>

<script>
(() => {
  // ---------- SDG-hjul ----------
  const SDG = ['#E5243B','#DDA63A','#4C9F38','#C5192D','#FF3A21','#26BDE2','#FCC30B','#A21942','#FD6925','#DD1367','#FD9D24','#BF8B2E','#3F7E44','#0A97D9','#56C02B','#00689D','#19486A'];
  function wheel(el){
    const n = SDG.length, R = 49, r = 30, gap = 0.04;
    const pt = (rad, a) => (50 + rad*Math.cos(a)).toFixed(3) + ' ' + (50 + rad*Math.sin(a)).toFixed(3);
    let s = '';
    for (let i = 0; i < n; i++){
      const a0 = -Math.PI/2 + i*2*Math.PI/n + gap/2, a1 = -Math.PI/2 + (i+1)*2*Math.PI/n - gap/2;
      s += `<path fill="${SDG[i]}" d="M${pt(R,a0)} A${R} ${R} 0 0 1 ${pt(R,a1)} L${pt(r,a1)} A${r} ${r} 0 0 0 ${pt(r,a0)} Z"/>`;
    }
    el.innerHTML = `<svg viewBox="0 0 100 100" aria-hidden="true">${s}</svg>`;
  }
  const drawWheels = () => document.querySelectorAll('.wheel:empty').forEach(wheel);
  drawWheels();

  // ---------- stage ----------
  const app = document.getElementById('app'), stage = document.getElementById('stage');
  const W = 1600, H = 900;
  function fit(){
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = `translate(${(innerWidth - W*s)/2}px,${(innerHeight - H*s)/2}px) scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  // ---------- navigering ----------
  let slides = [], i = 0, f = 0, unlocked = false;
  const counter = document.getElementById('counter'), progress = document.getElementById('progress');
  function frags(k){ return [...slides[k].querySelectorAll('.frag')]; }
  function render(){
    slides.forEach((s, k) => s.classList.toggle('is-active', k === i));
    frags(i).forEach((el, k) => el.classList.toggle('on', k < f));
    counter.textContent = `${i+1} / ${slides.length}`;
    progress.style.transform = `scaleX(${(i+1)/slides.length})`;
    const h = '#' + (i+1);
    if (location.hash !== h) history.replaceState(null, '', h);
  }
  function goto(k, showAll){
    i = Math.max(0, Math.min(slides.length-1, k));
    f = showAll ? frags(i).length : 0;
    render();
  }
  function next(){ if (f < frags(i).length) { f++; render(); } else if (i < slides.length-1) goto(i+1); }
  function prev(){ if (f > 0) { f--; render(); } else if (i > 0) goto(i-1, true); }
  function fromHash(){ const n = parseInt(location.hash.slice(1), 10); goto(isNaN(n) ? 0 : n-1, false); }

  addEventListener('keydown', e => {
    if (!unlocked) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    switch (e.key){
      case 'ArrowRight': case 'ArrowDown': case ' ': case 'PageDown': case 'Enter': e.preventDefault(); next(); break;
      case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': e.preventDefault(); prev(); break;
      case 'Home': goto(0); break;
      case 'End': goto(slides.length-1, true); break;
      case 'f': case 'F': document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); break;
    }
  });
  app.addEventListener('click', e => { if (!unlocked) return; (e.clientX < innerWidth/4) ? prev() : next(); });
  let tx = null;
  addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
  addEventListener('touchend', e => {
    if (!unlocked || tx === null) return;
    const dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
  }, {passive:true});
  addEventListener('hashchange', () => { if (unlocked) fromHash(); });

  // ---------- gate / kryptering ----------
  const payload = JSON.parse(document.getElementById('payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const norm = s => s.normalize('NFC').trim().toLowerCase();
  async function decrypt(pw){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b64(payload.salt), iterations:payload.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(payload.iv)}, key, b64(payload.ct));
    return new TextDecoder().decode(pt);
  }
  const gate = document.getElementById('gate'), form = document.getElementById('gate-form'),
        pwEl = document.getElementById('pw'), err = document.getElementById('err'), go = document.getElementById('go');
  function unlock(html){
    stage.insertAdjacentHTML('beforeend', html);
    drawWheels();
    slides = [...stage.querySelectorAll('.slide')];
    unlocked = true;
    app.classList.remove('locked'); app.classList.add('unlocked');
    gate.classList.add('away');
    fromHash();
    setTimeout(() => pwEl.blur(), 0);
  }
  const insecure = !(window.isSecureContext && crypto.subtle);
  const httpsUrl = 'https://' + location.host + location.pathname + location.hash;
  async function attempt(pw, quiet){
    if (insecure){
      err.innerHTML = 'Sidan måste öppnas via https för att kunna låsas upp: <a href="' + httpsUrl + '" style="color:var(--un)">' + httpsUrl + '</a>';
      return;
    }
    go.disabled = true; err.textContent = '';
    try {
      const html = await decrypt(pw);
      try { sessionStorage.setItem('skb2609', pw); } catch {}
      unlock(html);
    } catch (e) {
      go.disabled = false;
      if (!quiet){
        err.textContent = 'Fel lösenord. Försök igen.';
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
        pwEl.select();
      }
    }
  }
  form.addEventListener('submit', e => { e.preventDefault(); if (pwEl.value) attempt(pwEl.value, false); });
  try { const s = sessionStorage.getItem('skb2609'); if (s) attempt(s, true); } catch {}
  if (insecure) err.innerHTML = 'Öppna via https: <a href="' + httpsUrl + '" style="color:var(--un)">' + httpsUrl + '</a>';
})();
</script>
